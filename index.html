<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>WebOS 2.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --accent: #667eea;
    --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --window-bg: #fff;
    --window-header: #f0f0f0;
    --text: #222;
    --taskbar-bg: rgba(20,20,30,0.95);
    --taskbar-text: #fff;
  }
  body.dark {
    --window-bg: #2a2a2e;
    --window-header: #1e1e22;
    --text: #eee;
  }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
    height: 100vh;
    background: var(--bg-gradient);
    color: var(--text);
    user-select: none;
  }

  /* Boot */
  #boot {
    position: fixed; inset:0; background:#000; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index: 10000;
  }
  #boot .logo { font-size: 64px; margin-bottom: 20px; animation: pulse 1.5s infinite; }
  #boot .bar { width: 300px; height: 4px; background:#333; border-radius:2px; overflow:hidden; }
  #boot .bar::after {
    content:''; display:block; width:40%; height:100%; background:var(--accent);
    animation: load 1.5s infinite;
  }
  @keyframes load { 0%{transform:translateX(-100%);} 100%{transform:translateX(350%);} }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  /* Lock */
  #lock {
    position: fixed; inset:0; background: var(--bg-gradient);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index: 9000; color:#fff;
  }
  #lock .time { font-size: 80px; font-weight: 200; }
  #lock .date { font-size: 20px; margin-bottom: 40px; opacity: 0.9; }
  #lock input {
    padding: 10px 20px; font-size: 16px; border:none; border-radius: 20px;
    background: rgba(255,255,255,0.2); color:#fff; outline:none; width: 250px;
    backdrop-filter: blur(10px);
  }
  #lock input::placeholder { color: rgba(255,255,255,0.7); }
  #lock .hint { margin-top: 10px; font-size: 12px; opacity: 0.7; }

  /* Desktop */
  #desktop {
    width: 100%; height: calc(100vh - 48px);
    position: relative; padding: 20px;
  }
  .desktop-icon {
    width: 80px; text-align:center; cursor:pointer;
    margin-bottom: 10px; display:inline-block; vertical-align:top;
    padding: 6px; border-radius: 6px;
  }
  .desktop-icon:hover { background: rgba(255,255,255,0.15); }
  .desktop-icon .icon {
    width: 48px; height: 48px; margin: 0 auto 6px;
    background: rgba(255,255,255,0.2); border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    font-size: 24px; backdrop-filter: blur(5px);
  }
  .desktop-icon .label {
    color: #fff; font-size: 12px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }

  /* Windows */
  .window {
    position: absolute; min-width: 300px; min-height: 200px;
    background: var(--window-bg); color: var(--text);
    border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    display:flex; flex-direction:column; overflow:hidden;
    animation: openWin 0.2s ease;
  }
  .window.closing { animation: closeWin 0.15s ease forwards; }
  .window.minimized { display: none; }
  .window.maximized {
    left: 0 !important; top: 0 !important;
    width: 100% !important; height: calc(100vh - 48px) !important;
    border-radius: 0;
  }
  .window.snapped-left {
    left: 0 !important; top: 0 !important;
    width: 50% !important; height: calc(100vh - 48px) !important;
    border-radius: 0;
  }
  .window.snapped-right {
    left: 50% !important; top: 0 !important;
    width: 50% !important; height: calc(100vh - 48px) !important;
    border-radius: 0;
  }
  @keyframes openWin { from{opacity:0; transform:scale(0.95);} to{opacity:1; transform:scale(1);} }
  @keyframes closeWin { to{opacity:0; transform:scale(0.95);} }

  .window-header {
    background: var(--window-header); padding: 8px 12px;
    display:flex; justify-content:space-between; align-items:center;
    cursor: move;
  }
  .window-title { font-weight:600; font-size:13px; }
  .window-controls button {
    background:none; border:none; font-size:14px; cursor:pointer;
    width: 28px; height: 24px; border-radius: 4px; color: var(--text);
  }
  .window-controls button:hover { background: rgba(128,128,128,0.3); }
  .window-controls .close:hover { background: #e81123; color:#fff; }
  .window-content { flex:1; padding: 12px; overflow:auto; }

  /* Taskbar */
  #taskbar {
    position: fixed; bottom:0; width:100%; height: 48px;
    background: var(--taskbar-bg); color: var(--taskbar-text);
    display:flex; align-items:center; padding: 0 8px; gap: 6px;
    backdrop-filter: blur(20px);
  }
  .tb-btn {
    padding: 6px 12px; background: rgba(255,255,255,0.08);
    border-radius: 4px; cursor:pointer; font-size: 13px;
    display:flex; align-items:center; gap:6px;
    transition: background 0.15s;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.18); }
  .tb-btn.active { background: rgba(255,255,255,0.25); border-bottom: 2px solid var(--accent); }
  #start-btn { background: var(--accent); font-weight:600; }
  #show-desktop { width: 8px; height: 32px; padding:0; margin-left:auto; }
  #clock { padding: 0 12px; font-size: 12px; text-align:right; line-height:1.3; }
  #battery { padding: 0 10px; font-size: 14px; }

  /* Start menu */
  #start-menu {
    position: fixed; bottom: 56px; left: 8px;
    width: 320px; background: var(--taskbar-bg); color:#fff;
    border-radius: 8px; padding: 12px; display:none;
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    animation: slideUp 0.15s ease;
  }
  @keyframes slideUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  #start-menu h3 { font-size: 12px; opacity: 0.7; margin: 8px 0 4px; text-transform:uppercase; }
  .start-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .start-item {
    padding: 12px 8px; text-align:center; cursor:pointer;
    border-radius: 6px; font-size: 12px;
  }
  .start-item:hover { background: rgba(255,255,255,0.15); }
  .start-item .icon { font-size: 24px; display:block; margin-bottom: 4px; }
  #start-menu .footer {
    display:flex; justify-content:space-between; margin-top: 12px;
    padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
  }
  #start-menu .footer span { cursor:pointer; padding: 4px 8px; border-radius: 4px; }
  #start-menu .footer span:hover { background: rgba(255,255,255,0.15); }

  /* Context menu */
  #context-menu {
    position: fixed; background: var(--window-bg); color: var(--text);
    border-radius: 6px; padding: 4px; display:none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3); min-width: 180px;
    z-index: 5000;
  }
  .ctx-item {
    padding: 8px 12px; cursor:pointer; border-radius: 4px; font-size: 13px;
  }
  .ctx-item:hover { background: var(--accent); color:#fff; }
  .ctx-sep { height:1px; background: rgba(128,128,128,0.3); margin: 4px 0; }

  /* Notifications */
  #notifications {
    position: fixed; right: 20px; bottom: 60px;
    display:flex; flex-direction:column; gap: 8px; z-index: 8000;
  }
  .notification {
    background: var(--window-bg); color: var(--text);
    padding: 12px 16px; border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    min-width: 250px; animation: slideIn 0.2s ease;
    border-left: 4px solid var(--accent);
  }
  @keyframes slideIn { from{transform:translateX(100%); opacity:0;} to{transform:translateX(0); opacity:1;} }
  .notification .title { font-weight:600; font-size: 13px; margin-bottom: 4px; }
  .notification .body { font-size: 12px; opacity: 0.8; }

  /* App-specific */
  textarea {
    width:100%; height:100%; border:none; outline:none; resize:none;
    font-family: monospace; font-size: 14px;
    background: transparent; color: var(--text);
  }
  .calc-display {
    width:100%; font-size: 28px; text-align:right;
    padding: 12px; margin-bottom: 10px;
    background: rgba(128,128,128,0.1); border:none; border-radius: 4px;
    color: var(--text);
  }
  .calc-grid { display:grid; grid-template-columns: repeat(4,1fr); gap: 4px; }
  .calc-grid button {
    padding: 16px; font-size: 16px; cursor:pointer;
    background: rgba(128,128,128,0.15); border:none; border-radius: 4px;
    color: var(--text);
  }
  .calc-grid button:hover { background: rgba(128,128,128,0.3); }
  .calc-grid .op { background: var(--accent); color:#fff; }

  .terminal {
    background:#000; color:#0f0; font-family: monospace; font-size: 13px;
    padding: 10px; height:100%; overflow:auto;
  }
  .terminal input {
    background:transparent; border:none; outline:none; color:#0f0;
    font-family: monospace; font-size: 13px; width: 80%;
  }

  .file-manager { display:flex; height:100%; gap: 8px; }
  .file-sidebar {
    width: 150px; background: rgba(128,128,128,0.1);
    padding: 8px; border-radius: 4px; overflow:auto;
  }
  .file-main { flex:1; overflow:auto; }
  .file-item {
    padding: 6px 10px; cursor:pointer; border-radius: 4px;
    display:flex; align-items:center; gap:8px; font-size: 13px;
  }
  .file-item:hover { background: rgba(128,128,128,0.2); }
  .file-item.selected { background: var(--accent); color:#fff; }
  .file-toolbar {
    display:flex; gap: 4px; margin-bottom: 8px;
  }
  .file-toolbar button {
    padding: 4px 10px; font-size: 12px; cursor:pointer;
    background: rgba(128,128,128,0.15); border:none; border-radius: 4px;
    color: var(--text);
  }

  .settings-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,0.2);
  }
  .settings-row label { font-size: 13px; }
  .settings-row select, .settings-row input {
    padding: 4px 8px; border-radius: 4px;
    border: 1px solid rgba(128,128,128,0.3);
    background: transparent; color: var(--text);
  }
  .btn {
    padding: 6px 14px; cursor:pointer;
    background: var(--accent); color:#fff; border:none; border-radius: 4px;
    font-size: 13px;
  }
  .btn:hover { opacity: 0.9; }
  .btn.danger { background: #e81123; }

  .clock-app { text-align:center; padding: 20px; }
  .clock-app .big { font-size: 60px; font-weight: 200; }

  .paint-canvas { border: 1px solid rgba(128,128,128,0.3); cursor: crosshair; }

  .browser-bar {
    display:flex; gap: 4px; padding: 6px;
    background: rgba(128,128,128,0.1);
  }
  .browser-bar input {
    flex:1; padding: 4px 8px; border-radius: 4px;
    border: 1px solid rgba(128,128,128,0.3);
    background: transparent; color: var(--text);
  }
  .browser-frame { width:100%; height: calc(100% - 40px); border:none; background:#fff; }

  .task-list-item {
    display:flex; justify-content:space-between; align-items:center;
    padding: 8px; border-bottom: 1px solid rgba(128,128,128,0.2);
    font-size: 13px;
  }
</style>
</head>
<body>

<!-- Boot -->
<div id="boot">
  <div class="logo">🖥️</div>
  <div style="font-size: 24px; margin-bottom: 20px;">WebOS 2.0</div>
  <div class="bar"></div>
  <div style="margin-top: 20px; opacity: 0.6; font-size: 13px;">Загрузка системы...</div>
</div>

<!-- Lock -->
<div id="lock">
  <div class="time" id="lock-time">--:--</div>
  <div class="date" id="lock-date">—</div>
  <input type="password" id="lock-pass" placeholder="Пароль (оставьте пустым)" autofocus>
  <div class="hint">Нажмите Enter для входа</div>
</div>

<!-- Desktop -->
<div id="desktop"></div>

<!-- Taskbar -->
<div id="taskbar">
  <div class="tb-btn" id="start-btn">⊞ Пуск</div>
  <div id="tb-apps" style="display:flex; gap:4px;"></div>
  <div class="tb-btn" id="show-desktop" title="Показать рабочий стол"></div>
  <div id="battery">🔋</div>
  <div id="clock">--:--<br><span style="font-size:10px;">--</span></div>
</div>

<!-- Start menu -->
<div id="start-menu">
  <h3>Приложения</h3>
  <div class="start-grid" id="start-grid"></div>
  <div class="footer">
    <span id="user-name">Пользователь</span>
    <span id="lock-btn">🔒 Заблокировать</span>
    <span id="shutdown-btn">⏻ Выключить</span>
  </div>
</div>

<!-- Context menu -->
<div id="context-menu"></div>

<!-- Notifications -->
<div id="notifications"></div>

<script>
// ===================== STORAGE =====================
const Store = {
  get(k, def) {
    try { const v = localStorage.getItem('webos_' + k); return v ? JSON.parse(v) : def; }
    catch { return def; }
  },
  set(k, v) { localStorage.setItem('webos_' + k, JSON.stringify(v)); },
  del(k) { localStorage.removeItem('webos_' + k); }
};

// ===================== SOUND =====================
const Sound = {
  ctx: null,
  init() { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} },
  beep(freq = 440, dur = 0.08, type = 'sine') {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.1, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + dur);
  },
  click() { this.beep(800, 0.03); },
  open() { this.beep(600, 0.08); setTimeout(()=>this.beep(900, 0.08), 60); },
  close() { this.beep(400, 0.08); },
  error() { this.beep(200, 0.2, 'sawtooth'); }
};

// ===================== FILE SYSTEM =====================
const FS = {
  data: Store.get('fs', {
    '/': { type: 'dir', children: {
      'Документы': { type: 'dir', children: {
        'readme.txt': { type: 'file', content: 'Добро пожаловать в WebOS 2.0!' }
      }},
      'Изображения': { type: 'dir', children: {} },
      'Загрузки': { type: 'dir', children: {} }
    }}
  }),
  save() { Store.set('fs', this.data); },
  resolve(path) {
    const parts = path.split('/').filter(Boolean);
    let node = this.data['/'];
    for (const p of parts) {
      if (!node.children || !node.children[p]) return null;
      node = node.children[p];
    }
    return node;
  },
  list(path) {
    const node = this.resolve(path);
    if (!node || node.type !== 'dir') return [];
    return Object.keys(node.children);
  },
  create(path, name, type, content = '') {
    const node = this.resolve(path);
    if (!node || node.type !== 'dir') return false;
    node.children[name] = type === 'dir' ? { type: 'dir', children: {} } : { type: 'file', content };
    this.save(); return true;
  },
  remove(path, name) {
    const node = this.resolve(path);
    if (!node || !node.children[name]) return false;
    delete node.children[name]; this.save(); return true;
  },
  rename(path, oldName, newName) {
    const node = this.resolve(path);
    if (!node || !node.children[oldName]) return false;
    node.children[newName] = node.children[oldName];
    delete node.children[oldName]; this.save(); return true;
  },
  read(path) {
    const node = this.resolve(path);
    return node && node.type === 'file' ? node.content : null;
  },
  write(path, content) {
    const node = this.resolve(path);
    if (!node || node.type !== 'file') return false;
    node.content = content; this.save(); return true;
  }
};

// ===================== NOTIFICATIONS =====================
function notify(title, body, dur = 3000) {
  const el = document.createElement('div');
  el.className = 'notification';
  el.innerHTML = `<div class="title">${title}</div><div class="body">${body}</div>`;
  document.getElementById('notifications').appendChild(el);
  Sound.click();
  setTimeout(() => {
    el.style.transition = 'opacity 0.3s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 300);
  }, dur);
}

// ===================== WINDOW MANAGER =====================
const WM = {
  windows: {},
  counter: 0,
  zIndex: 100,
  activeId: null,

  create(appKey, opts = {}) {
    const app = APPS[appKey];
    if (!app) return;
    const id = 'win-' + (++this.counter);
    const w = document.createElement('div');
    w.className = 'window';
    w.id = id;
    const width = opts.width || 500;
    const height = opts.height || 380;
    const desktop = document.getElementById('desktop');
    const maxX = desktop.clientWidth - width - 20;
    const maxY = desktop.clientHeight - height - 20;
    w.style.width = width + 'px';
    w.style.height = height + 'px';
    w.style.left = Math.max(20, Math.min(maxX, 100 + Math.random() * 200)) + 'px';
    w.style.top = Math.max(20, Math.min(maxY, 50 + Math.random() * 100)) + 'px';

    w.innerHTML = `
      <div class="window-header">
        <div class="window-title">${app.icon} ${opts.title || app.name}</div>
        <div class="window-controls">
          <button class="min" title="Свернуть">–</button>
          <button class="max" title="Развернуть">▢</button>
          <button class="close" title="Закрыть">×</button>
        </div>
      </div>
      <div class="window-content"></div>
    `;

    const content = w.querySelector('.window-content');
    const state = app.init(content, opts);

    w.querySelector('.min').onclick = (e) => { e.stopPropagation(); this.minimize(id); };
    w.querySelector('.max').onclick = (e) => { e.stopPropagation(); this.toggleMax(id); };
    w.querySelector('.close').onclick = (e) => { e.stopPropagation(); this.close(id); };
    w.addEventListener('mousedown', () => this.focus(id));

    this.makeDraggable(w);
    desktop.appendChild(w);

    this.windows[id] = { id, appKey, w, state, minimized: false, maximized: false };
    this.focus(id);
    this.updateTaskbar();
    Sound.open();
    return id;
  },

  focus(id) {
    const win = this.windows[id];
    if (!win) return;
    if (win.minimized) {
      win.w.classList.remove('minimized');
      win.minimized = false;
    }
    this.zIndex++;
    win.w.style.zIndex = this.zIndex;
    this.activeId = id;
    this.updateTaskbar();
  },

  minimize(id) {
    const win = this.windows[id];
    if (!win) return;
    win.w.classList.add('minimized');
    win.minimized = true;
    this.activeId = null;
    this.updateTaskbar();
    Sound.click();
  },

  toggleMax(id) {
    const win = this.windows[id];
    if (!win) return;
    win.maximized = !win.maximized;
    win.w.classList.toggle('maximized', win.maximized);
    win.w.classList.remove('snapped-left', 'snapped-right');
    Sound.click();
  },

  close(id) {
    const win = this.windows[id];
    if (!win) return;
    win.w.classList.add('closing');
    setTimeout(() => {
      win.w.remove();
      delete this.windows[id];
      if (this.activeId === id) this.activeId = null;
      this.updateTaskbar();
    }, 150);
    Sound.close();
  },

  closeAll() {
    Object.keys(this.windows).forEach(id => this.close(id));
  },

  makeDraggable(w) {
    const header = w.querySelector('.window-header');
    let dragging = false, offX = 0, offY = 0;
    const desktop = document.getElementById('desktop');

    header.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      const win = this.windows[w.id];
      if (win && win.maximized) return;
      dragging = true;
      const rect = w.getBoundingClientRect();
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      w.classList.remove('snapped-left', 'snapped-right');
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      let x = e.clientX - offX;
      let y = e.clientY - offY;
      // Ограничение
      const maxX = desktop.clientWidth - 50;
      const maxY = desktop.clientHeight - 30;
      x = Math.max(-w.clientWidth + 100, Math.min(maxX, x));
      y = Math.max(0, Math.min(maxY, y));
      w.style.left = x + 'px';
      w.style.top = y + 'px';

      // Snap preview
      if (e.clientX <= 5) w.style.opacity = '0.7';
      else if (e.clientX >= window.innerWidth - 5) w.style.opacity = '0.7';
      else w.style.opacity = '1';
    });

    document.addEventListener('mouseup', (e) => {
      if (!dragging) return;
      dragging = false;
      w.style.opacity = '1';
      if (e.clientX <= 5) {
        const win = this.windows[w.id];
        if (win) { win.maximized = false; }
        w.classList.remove('maximized');
        w.classList.add('snapped-left');
      } else if (e.clientX >= window.innerWidth - 5) {
        const win = this.windows[w.id];
        if (win) { win.maximized = false; }
        w.classList.remove('maximized');
        w.classList.add('snapped-right');
      }
    });
  },

  updateTaskbar() {
    const tb = document.getElementById('tb-apps');
    tb.innerHTML = '';
    Object.values(this.windows).forEach(win => {
      const app = APPS[win.appKey];
      const btn = document.createElement('div');
      btn.className = 'tb-btn' + (this.activeId === win.id && !win.minimized ? ' active' : '');
      btn.innerHTML = `${app.icon} ${app.name}`;
      btn.onclick = () => {
        if (this.activeId === win.id && !win.minimized) this.minimize(win.id);
        else this.focus(win.id);
      };
      tb.appendChild(btn);
    });
  }
};

// ===================== APPS =====================
const APPS = {
  notepad: {
    name: 'Блокнот', icon: '📝',
    init(content, opts) {
      const path = opts.path || null;
      const ta = document.createElement('textarea');
      ta.placeholder = 'Введите текст...';
      if (path) ta.value = FS.read(path) || '';

        main.innerHTML = '';

          const c = node.children[n];

          el.className = 'file-item' + (selected === n ? ' selected' : '');
          el.innerHTML = `${c.type === 'dir' ? '📁' : '📄'} ${n}`;
          el.onclick = () => { selected = n; render(); };
          el.ondblclick = () => {

        WM.create('notepad', { path, title: path.split('/').filter(Boolean).pop() });

  terminal: {
    name: 'Терминал', icon: '💻',
    init(content) {
      content.style.padding = '0';
      content.innerHTML = `<div class="terminal" id="term"></div>`;
      const term = content.querySelector('#term');
      const history = [];
      let histIdx = -1;

      const print = (text, cls = '') => {
        const d = document.createElement('div');
        d.innerHTML = text;
        if (cls) d.style.color = cls;
        term.appendChild(d);
      };
      const prompt = () => {
        const line = document.createElement('div');
        line.innerHTML = `<span style="color:#0f0">user@webos</span>:<span style="color:#66f">~</span>$ <input autofocus>`;
        term.appendChild(line);
        const inp = line.querySelector('input');
        inp.focus();
        inp.onkeydown = (e) => {
          if (e.key === 'Enter') {
            const cmd = inp.value.trim();
            inp.disabled = true;
            if (cmd) { history.push(cmd); histIdx = history.length; }
            exec(cmd);
            prompt();
            term.scrollTop = term.scrollHeight;
          } else if (e.key === 'ArrowUp') {
            if (histIdx > 0) { histIdx--; inp.value = history[histIdx] || ''; }
            e.preventDefault();
          } else if (e.key === 'ArrowDown') {
            if (histIdx < history.length - 1) { histIdx++; inp.value = history[histIdx] || ''; }
            else { histIdx = history.length; inp.value = ''; }
            e.preventDefault();
          }
        };
      };
      const exec = (cmd) => {
        const [c, ...args] = cmd.split(' ');
        switch(c) {
          case '': break;
          case 'help':
            print('Команды: help, clear, ls, pwd, echo, date, time, apps, open, whoami, neofetch, shutdown');
            break;
          case 'clear': term.innerHTML = ''; break;
          case 'ls': print(FS.list('/').join('  ')); break;
          case 'pwd': print('/home/user'); break;
          case 'echo': print(args.join(' ')); break;
          case 'date': print(new Date().toLocaleDateString('ru-RU')); break;
          case 'time': print(new Date().toLocaleTimeString('ru-RU')); break;
          case 'apps': print(Object.keys(APPS).join('  ')); break;
          case 'open':
            if (APPS[args[0]]) { WM.create(args[0]); print(`Открыто: ${args[0]}`); }
            else { print('Приложение не найдено', '#f55'); Sound.error(); }
            break;
          case 'whoami': print(Store.get('username', 'user')); break;
          case 'neofetch':
            print(`<pre style="color:#0ff">
   ╭─────╮     user@webos
   │ Web │     ----------
   │ OS  │     OS: WebOS 2.0
   ╰─────╯     Kernel: JS
               Shell: wsh
               Apps: ${Object.keys(APPS).length}
            </pre>`);
            break;
          case 'shutdown':
            if (confirm('Выключить систему?')) location.reload();
            break;
          default:
            print(`Команда не найдена: ${c}`, '#f55');
            Sound.error();
        }
      };
      print('WebOS Terminal v1.0 — введите "help" для списка команд', '#888');
      prompt();
      term.onclick = () => {
        const last = term.querySelector('input:not([disabled])');
        if (last) last.focus();
      };
      return {};
    }
  },

// ===================== START MENU =====================
function renderStartMenu() {
  const grid = document.getElementById('start-grid');
  grid.innerHTML = '';
  Object.entries(APPS).forEach(([key, app]) => {
    const el = document.createElement('div');
    el.className = 'start-item';
    el.innerHTML = `<span class="icon">${app.icon}</span>${app.name}`;
    el.onclick = () => { WM.create(key); toggleStart(false); };
    grid.appendChild(el);
  });
}

function toggleStart(force) {
  const m = document.getElementById('start-menu');
  const show = force === undefined ? m.style.display !== 'block' : force;
  m.style.display = show ? 'block' : 'none';
}

// ===================== CONTEXT MENU =====================
function showContextMenu(x, y) {
  const m = document.getElementById('context-menu');
  m.innerHTML = `
    <div class="ctx-item" data-a="refresh">🔄 Обновить</div>
    <div class="ctx-item" data-a="wallpaper">🖼️ Сменить обои</div>
    <div class="ctx-item" data-a="theme">🎨 Сменить тему</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-a="settings">⚙️ Настройки</div>
    <div class="ctx-item" data-a="tasks">📊 Диспетчер задач</div>
    <div class="ctx-item" data-a="about">ℹ️ О системе</div>
  `;
  m.style.display = 'block';
  m.style.left = Math.min(x, window.innerWidth - 200) + 'px';
  m.style.top = Math.min(y, window.innerHeight - 250) + 'px';
  m.querySelectorAll('.ctx-item').forEach(i => {
    i.onclick = () => {
      const a = i.dataset.a;
      if (a === 'refresh') { renderDesktopIcons(); notify('Рабочий стол', 'Обновлено'); }
      else if (a === 'wallpaper' || a === 'theme') WM.create('settings');
      else if (a === 'settings') WM.create('settings');
      else if (a === 'tasks') WM.create('tasks');
      else if (a === 'about') WM.create('about');
      m.style.display = 'none';
    };
  });
}

// ===================== CLOCK & BATTERY =====================
function updateClock() {
  const n = new Date();
  const t = n.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const d = n.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
  document.getElementById('clock').innerHTML = `${t}<br><span style="font-size:10px;">${d}</span>`;
  const lt = document.getElementById('lock-time');
  const ld = document.getElementById('lock-date');
  if (lt) lt.textContent = t;
  if (ld) ld.textContent = n.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
}

function updateBattery() {
  const el = document.getElementById('battery');
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      const lvl = Math.round(b.level * 100);
      const ic = b.charging ? '🔌' : (lvl < 20 ? '🪫' : '🔋');
      el.textContent = `${ic} ${lvl}%`;
    });
  } else el.textContent = '🔋';
}

// ===================== DRAG & DROP =====================
function setupDragDrop() {
  const desktop = document.getElementById('desktop');
  desktop.addEventListener('dragover', (e) => { e.preventDefault(); desktop.style.outline = '2px dashed #fff'; });
  desktop.addEventListener('dragleave', () => { desktop.style.outline = 'none'; });
  desktop.addEventListener('drop', (e) => {
    e.preventDefault();
    desktop.style.outline = 'none';
    const files = e.dataTransfer.files;
    for (const f of files) {
      if (f.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          FS.create('/Изображения/', f.name, 'file', ev.target.result);
          notify('Файлы', `Импортировано: ${f.name}`);
        };
        reader.readAsDataURL(f);
      } else if (f.type.startsWith('text/') || f.name.endsWith('.txt')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          FS.create('/Документы/', f.name, 'file', ev.target.result);
          notify('Файлы', `Импортировано: ${f.name}`);
        };
        reader.readAsText(f);
      } else {
        notify('Файлы', `Тип не поддерживается: ${f.name}`);
      }
    }
  });
}

// ===================== BOOT & LOCK =====================
function boot() {
  setTimeout(() => {
    document.getElementById('boot').style.display = 'none';
    const pass = Store.get('password', '');
    if (pass) {
      document.getElementById('lock').style.display = 'flex';
      document.getElementById('lock-pass').focus();
    } else {
      enterDesktop();
    }
  }, 1800);
}

function enterDesktop() {
  document.getElementById('lock').style.display = 'none';
  renderDesktopIcons();
  renderStartMenu();
  document.getElementById('user-name').textContent = Store.get('username', 'Пользователь');
  // Восстановление темы
  if (Store.get('dark')) document.body.classList.add('dark');
  const wp = Store.get('wallpaper');
  if (wp) document.body.style.background = wp;
  notify('WebOS', 'Добро пожаловать!');
}

function lockScreen() {
  Object.keys(WM.windows).forEach(id => WM.minimize(id));
  toggleStart(false);
  document.getElementById('lock').style.display = 'flex';
  document.getElementById('lock-pass').value = '';
  document.getElementById('lock-pass').focus();
}

// ===================== INIT =====================
window.addEventListener('DOMContentLoaded', () => {
  Sound.init();
  updateClock();
  setInterval(updateClock, 1000);
  updateBattery();
  setInterval(updateBattery, 30000);
  setupDragDrop();

  // Events
  document.getElementById('start-btn').onclick = (e) => {
    e.stopPropagation();
    toggleStart();
    Sound.click();
  };
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) toggleStart(false);
    if (!e.target.closest('#context-menu')) document.getElementById('context-menu').style.display = 'none';
  });
  document.getElementById('desktop').addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showContextMenu(e.clientX, e.clientY);
  });
  document.getElementById('show-desktop').onclick = () => {
    Object.keys(WM.windows).forEach(id => WM.minimize(id));
  };
  document.getElementById('lock-btn').onclick = () => lockScreen();
  document.getElementById('shutdown-btn').onclick = () => {
    if (confirm('Выключить систему?')) location.reload();
  };
  document.getElementById('lock-pass').onkeydown = (e) => {
    if (e.key === 'Enter') {
      const pass = Store.get('password', '');
      if (!pass || e.target.value === pass) enterDesktop();
      else {
        e.target.value = '';
        e.target.style.background = 'rgba(255,0,0,0.3)';
        Sound.error();
        setTimeout(() => e.target.style.background = 'rgba(255,255,255,0.2)', 500);
      }
    }
  };

  // Первый клик инициализирует AudioContext
  document.addEventListener('click', () => { if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume(); }, { once: true });

  boot();
});
</script>
